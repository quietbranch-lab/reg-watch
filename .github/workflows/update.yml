name: Update regulatory news

on:
  schedule:
    # GitHubのスケジュールは高負荷時に遅延するだけでなく、実行自体が捨てられる。
    # 実際 6:00 指定の回は 6:56 に走り、3:40 指定の回は発火しなかった。
    # 早朝JSTは米国の業務時間帯と重なるため、時刻をずらしても混雑は避けきれない。
    # そこで朝のうちに3回試す。どれか1回でも通ればその日のぶんが揃う。
    # is_new は「その日に初めて見たか」で判定するので、同じ日に複数回走っても
    # 先に見つけた分は新着のまま残り、二重に数えることもない。
    - cron: "40 18 * * *"   # JST 03:40
    - cron: "20 20 * * *"   # JST 05:20
    - cron: "10 22 * * *"   # JST 07:10
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch news
        env:
          # ActionsのIPは公取委のWAFに遮断される。ここでは取りに行かず、
          # 国内回線から走るPC側の実行が入れた内容をそのまま残す。
          REG_WATCH_SKIP: jftc
        run: python scripts/fetch_news.py

      - name: Commit and push if changed
        run: |
          git config user.name "reg-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/news.json data/seen.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update news $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
