<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>規制当局 新着一覧</title>
<style>
  :root{
    --ink:#1C2733; --paper:#FBFAF7; --seal:#B5342A;
    --line:#E5E1D6; --muted:#8A8578; --faint:#9A958A;
    --serif:"Hiragino Mincho ProN","Yu Mincho","MS Mincho",serif;
    --sans:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}
  .wrap{max-width:860px;margin:0 auto;padding:0 18px}

  header{border-bottom:3px double var(--ink);padding:24px 0 16px}
  .eyebrow{font-size:11px;letter-spacing:.22em;color:var(--faint);margin-bottom:4px}
  h1{margin:0;font-family:var(--serif);font-size:26px;letter-spacing:.06em;font-weight:600}
  .headrow{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .meta{font-size:11px;color:var(--faint);margin-top:6px}

  .copybtn{font-size:14px;padding:10px 20px;background:var(--ink);color:#fff;
    border:none;border-radius:8px;cursor:pointer;letter-spacing:.05em}
  .copybtn:disabled{background:var(--muted);cursor:default}
  .copied{background:var(--seal) !important}

  nav{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .tab{font-size:12px;padding:6px 13px;border-radius:999px;border:1px solid #D8D3C6;
    background:#fff;color:#5A5648;cursor:pointer}
  .tab.on{border:1.5px solid var(--seal);background:rgba(181,52,42,.06);color:var(--seal)}

  main{padding:20px 0 40px}
  section{background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:18px 20px;margin-bottom:16px}
  .agency-head{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
  .seal-mark{width:42px;height:42px;flex-shrink:0;border:2.5px solid var(--seal);border-radius:6px;
    color:var(--seal);display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:22px;font-weight:700;background:rgba(181,52,42,.04)}
  h2{margin:0;font-family:var(--serif);font-size:17px;letter-spacing:.04em;flex:1;min-width:150px}
  .sitelink{font-size:12px;color:#5A6B7A;text-decoration:none}
  ul{list-style:none;margin:12px 0 0;padding:0}
  li{border-top:1px solid #F0EDE4;padding:9px 0;display:flex;gap:12px;align-items:baseline}
  li:first-child{border-top:none}
  .d{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;flex-shrink:0;width:82px}
  .t{font-size:14px;line-height:1.55;color:var(--ink);text-decoration:none;
    border-bottom:1px solid #C9C4B6}
  .t:hover{color:var(--seal);border-bottom-color:var(--seal)}
  .new{display:inline-block;font-size:10px;color:var(--seal);border:1px solid var(--seal);
    border-radius:3px;padding:0 4px;margin-right:6px;vertical-align:1px;font-weight:700}
  .empty{font-size:13px;color:var(--muted);margin:10px 0 0}
  footer{font-size:11px;color:var(--faint);line-height:1.7;padding-bottom:30px}
  .err{font-size:12px;color:var(--seal);margin-top:8px}
  button:focus-visible,a:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="headrow">
      <div>
        <div class="eyebrow">REGULATORY WATCH — 官庁新着情報モニター</div>
        <h1>規制当局 新着一覧</h1>
        <div class="meta" id="meta">読み込み中…</div>
      </div>
      <button class="copybtn" id="copyBtn" disabled>本日分をコピー</button>
    </div>
    <nav id="tabs" aria-label="表示切り替え"></nav>
  </header>
  <main id="main"></main>
  <footer>
    ※ 金融庁・財務省・証券取引等監視委員会は公式RSS、公正取引委員会・個人情報保護委員会は新着一覧ページの解析により毎朝自動取得しています。
    重要な確認は必ずリンク先の公式ページで行ってください。
    「本日分をコピー」は、本日初めて検出された項目（番号・官庁名・日付・件名・URL）をリスト形式でクリップボードに格納します。
  </footer>
</div>

<script>
"use strict";
let DATA = null;
let filter = "all";
let newOnly = false;

function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML;}

function todaysItems(){
  if(!DATA) return [];
  const out=[];
  for(const a of DATA.agencies){
    for(const it of a.items){
      if(it.is_new) out.push({agency:a.name, ...it});
    }
  }
  return out;
}

function buildCopyText(){
  const items=todaysItems();
  if(items.length===0) return null;
  const lines=items.map((it,i)=>
    `${i+1}. [${it.agency}] ${it.date||"日付不明"} ${it.title}\n   ${it.url}`);
  return lines.join("\n");
}

function render(){
  const meta=document.getElementById("meta");
  const main=document.getElementById("main");
  const btn=document.getElementById("copyBtn");
  if(!DATA){main.innerHTML="";return;}

  const newCount=todaysItems().length;
  meta.textContent=`最終取得: ${DATA.generated_at} JST ／ 本日の新着 ${newCount}件`;
  btn.disabled = newCount===0;
  btn.textContent = newCount===0 ? "本日の新着なし" : `本日分をコピー（${newCount}件）`;

  const tabs=document.getElementById("tabs");
  const defs=[{id:"all",name:"すべて"},...DATA.agencies,{id:"_new",name:"新着のみ"}];
  tabs.innerHTML=defs.map(d=>{
    const on=(d.id==="_new")? (newOnly?"on":"") : (!newOnly&&filter===d.id?"on":"");
    return `<button class="tab ${on}" data-id="${d.id}">${esc(d.name)}</button>`;
  }).join("");
  tabs.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
    const id=b.dataset.id;
    if(id==="_new"){newOnly=!newOnly;}
    else{filter=id;newOnly=false;}
    render();
  });

  const shown = DATA.agencies.filter(a=>filter==="all"||a.id===filter);
  main.innerHTML = shown.map(a=>{
    let items=a.items;
    if(newOnly) items=items.filter(i=>i.is_new);
    const list = items.length===0
      ? `<p class="empty">${newOnly?"本日の新着はありません":"項目がありません"}</p>`
      : `<ul>`+items.map(it=>`
        <li>
          <span class="d">${esc(it.date||"—")}</span>
          <span>${it.is_new?'<span class="new">新着</span>':""}<a class="t" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">${esc(it.title)}</a></span>
        </li>`).join("")+`</ul>`;
    return `<section>
      <div class="agency-head">
        <div class="seal-mark" aria-hidden="true">${esc(a.seal)}</div>
        <h2>${esc(a.name)}</h2>
        <a class="sitelink" href="${esc(a.site)}" target="_blank" rel="noopener noreferrer">公式サイト ↗</a>
      </div>
      ${list}
    </section>`;
  }).join("");

  if(DATA.errors && DATA.errors.length){
    main.innerHTML += `<p class="err">一部の取得に失敗しました（${DATA.errors.length}件）。翌朝の自動実行で回復しない場合はパーサ調整が必要です。</p>`;
  }
}

async function copyToday(){
  const text=buildCopyText();
  if(!text) return;
  const btn=document.getElementById("copyBtn");
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    // 権限制限がある社内ブラウザ向けフォールバック
    const ta=document.createElement("textarea");
    ta.value=text;document.body.appendChild(ta);ta.select();
    document.execCommand("copy");document.body.removeChild(ta);
  }
  const orig=btn.textContent;
  btn.textContent="コピーしました ✓";btn.classList.add("copied");
  setTimeout(()=>{btn.textContent=orig;btn.classList.remove("copied");},2000);
}

document.getElementById("copyBtn").onclick=copyToday;

fetch("data/news.json?t="+Date.now())
  .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
  .then(d=>{DATA=d;render();})
  .catch(()=>{
    document.getElementById("meta").textContent="データがまだありません。GitHub Actionsを一度手動実行してください。";
  });
</script>
</body>
</html>
