<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>規制当局 新着一覧</title>
<style>
  :root{
    --navy:#0F2547;
    --accent:#3F638C;
    --track-off:#D9DEE7;
    --paper:#F4F6F9;
    --card:#FFFFFF;
    --line:#E3E8EF;
    --muted:#6B7A90;
    --faint:#8A97A8;
    --danger:#C0392B;
    --warn:#8A6A1F;
    --sans:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--navy);
    font-family:var(--sans);-webkit-text-size-adjust:100%}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px 40px}

  header{padding:22px 0 4px}
  h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.02em}
  .meta{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.7;
    padding-bottom:14px;border-bottom:1px solid var(--line)}

  .alert{margin:14px 0 0;padding:11px 13px;border-radius:8px;
    background:#FCEEEC;border:1px solid #F0C8C2;color:var(--danger);
    font-size:13px;font-weight:700;line-height:1.6}

  .copybtn{width:100%;margin-top:14px;padding:15px 16px;background:var(--navy);
    color:#fff;border:none;border-radius:8px;cursor:pointer;
    font-size:15px;font-weight:700;font-family:inherit;letter-spacing:.03em}
  .copybtn:disabled{background:#AEB8C6;cursor:default}
  .copybtn.copied{background:var(--accent)}

  .label{font-size:13px;font-weight:700;color:var(--navy);margin:20px 0 8px}

  .seg{display:flex;background:var(--card);border:1px solid var(--line);
    border-radius:8px;overflow:hidden}
  .seg button{flex:1;padding:13px 8px;border:none;background:transparent;
    color:var(--muted);font-size:14px;font-family:inherit;cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff;font-weight:700}
  .seg button:focus-visible{outline:2px solid var(--navy);outline-offset:-3px}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  .row:first-child{border-top:none}
  .row-name{font-size:15px;line-height:1.4;min-width:0;overflow-wrap:anywhere}

  /* 角のある四角いスイッチ（カプセル型・円形ノブにはしない） */
  .sw{position:relative;width:54px;height:30px;flex-shrink:0}
  .sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;
    opacity:0;cursor:pointer;z-index:1}
  .sw-track{display:block;width:54px;height:30px;border-radius:5px;
    background:var(--track-off);border:1px solid #C6CEDA;transition:background .15s}
  .sw-knob{position:absolute;top:4px;left:4px;width:22px;height:22px;
    border-radius:3px;background:#fff;border:1px solid #C6CEDA;transition:left .15s}
  .sw input:checked ~ .sw-track{background:var(--accent);border-color:var(--accent)}
  .sw input:checked ~ .sw-knob{left:27px;border-color:#2F4E70}
  .sw input:focus-visible ~ .sw-track{outline:2px solid var(--navy);outline-offset:2px}

  main{margin-top:22px}
  section{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:16px 16px 6px;margin-bottom:14px}
  section.broken{border-color:#E7BDB6}
  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
  h2{margin:0;font-size:19px;font-weight:700;line-height:1.3;min-width:0;
    overflow-wrap:anywhere}
  .tag{font-size:11px;letter-spacing:.06em;padding:3px 9px;border-radius:5px;
    border:1px solid var(--line);color:var(--muted);white-space:nowrap;flex-shrink:0}
  .tag.fail{border-color:var(--danger);color:var(--danger);font-weight:700}
  .tag.part{border-color:var(--warn);color:var(--warn);font-weight:700}
  .sitelink{display:inline-block;margin-top:6px;font-size:13px;
    color:var(--accent);text-decoration:none}
  .sitelink:hover{text-decoration:underline}

  ul{list-style:none;margin:10px 0 0;padding:0}
  li{border-top:1px solid var(--line)}
  li a{display:flex;align-items:flex-start;gap:10px;padding:12px 0;
    text-decoration:none;color:inherit}
  li a:hover .t{color:var(--accent)}
  .d{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;
    flex-shrink:0;width:80px;padding-top:2px}
  .body{flex:1;min-width:0}
  .new{display:inline-block;font-size:10px;font-weight:700;color:var(--danger);
    border:1px solid var(--danger);border-radius:4px;padding:1px 5px;
    margin-right:7px;vertical-align:1px}
  .t{font-size:14px;line-height:1.6;overflow-wrap:anywhere}
  .chev{flex-shrink:0;color:#C2CBD8;font-size:15px;padding-top:2px}

  .empty{font-size:13px;color:var(--muted);margin:12px 0 14px}
  .failbox{margin:12px 0 14px;padding:11px 13px;border-radius:8px;
    background:#FCEEEC;border:1px solid #F0C8C2}
  .failmsg{margin:0;font-size:13px;font-weight:700;color:var(--danger)}
  .failnote{margin:6px 0 0;font-size:11px;color:var(--muted);line-height:1.7;
    overflow-wrap:anywhere}
  .notice{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:22px 16px;text-align:center;font-size:14px;color:var(--muted)}

  footer{font-size:11px;color:var(--faint);line-height:1.8;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>規制当局 新着一覧</h1>
    <div class="meta" id="meta">読み込み中…</div>
    <div id="alert"></div>
    <button class="copybtn" id="copyBtn" disabled>新着分をコピー</button>

    <p class="label">表示</p>
    <div class="seg" id="scopeRow" role="group" aria-label="表示範囲"></div>

    <p class="label">官庁</p>
    <div class="panel" id="agencyPanel"></div>
  </header>

  <main id="main"></main>

  <footer>
    ※ 個人的に閲覧するための一覧です。公式RSSがある機関はRSSから、無い機関は新着一覧ページの解析により、
    1日1回まとめて取得しています。内容の確認は必ずリンク先の公式ページで行ってください。
    新着は「前回の取得以降に初めて見つかった項目」で判定しているため、週明けは金曜以降のぶんがまとめて表示されます。
  </footer>
</div>

<script>
"use strict";
let DATA = null;
let newOnly = true;          // 既定は「前回取得以降の新着」のみ
let selected = new Set();    // オンになっている官庁のid

function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML;}
function newItemsOf(a){ return a.items.filter(i=>i.is_new); }
function shownAgencies(){ return DATA.agencies.filter(a=>selected.has(a.id)); }

/* コピー対象は「選択中の官庁の新着」。表示範囲の切り替えとは独立させ、
   ボタンの文言どおり常に新着だけを渡す。 */
function copyTargets(){
  if(!DATA) return [];
  const out=[];
  for(const a of shownAgencies()){
    for(const it of newItemsOf(a)) out.push({agency:a.name, ...it});
  }
  return out;
}

function buildCopyText(){
  const items=copyTargets();
  if(items.length===0) return null;
  return items.map((it,i)=>
    `${i+1}. [${it.agency}] ${it.date||"日付不明"} ${it.title}\n   ${it.url}`).join("\n");
}

function switchMarkup(id, on, name){
  return `<span class="row-name">${esc(name)}</span>`+
    `<span class="sw">`+
      `<input type="checkbox" role="switch" data-target="${id}"${on?" checked":""}>`+
      `<span class="sw-track" aria-hidden="true"></span>`+
      `<span class="sw-knob" aria-hidden="true"></span>`+
    `</span>`;
}

function renderScope(){
  const el=document.getElementById("scopeRow");
  el.innerHTML =
    `<button type="button" data-scope="new" class="${newOnly?"on":""}">新着のみ</button>`+
    `<button type="button" data-scope="all" class="${newOnly?"":"on"}">すべて</button>`;
  el.querySelectorAll("[data-scope]").forEach(b=>b.onclick=()=>{
    newOnly = b.dataset.scope==="new";
    render();
  });
}

function renderAgencyPanel(){
  const panel=document.getElementById("agencyPanel");
  const allOn = DATA.agencies.every(a=>selected.has(a.id));
  panel.innerHTML =
    `<label class="row">${switchMarkup("__all", allOn, "すべて選択")}</label>`+
    DATA.agencies.map(a=>
      `<label class="row">${switchMarkup(a.id, selected.has(a.id), a.name)}</label>`
    ).join("");

  panel.querySelectorAll("input[data-target]").forEach(input=>{
    input.onchange=()=>{
      const t=input.dataset.target;
      if(t==="__all"){
        // 一部だけオンの状態で押した場合も、全オンにそろえる
        if(input.checked) DATA.agencies.forEach(a=>selected.add(a.id));
        else selected.clear();
      }else{
        if(input.checked) selected.add(t); else selected.delete(t);
      }
      render();
    };
  });
}

function methodLabel(a){ return a.method==="rss" ? "RSS" : "HTML解析"; }

function tagFor(a){
  if(a.status==="error") return `<span class="tag fail">取得失敗</span>`;
  if(a.status==="partial") return `<span class="tag part">一部取得失敗</span>`;
  if(a.status==="manual") return `<span class="tag">手動確認</span>`;
  return `<span class="tag">${esc(methodLabel(a))}</span>`;
}

function bodyFor(a){
  // 自動取得の対象外。失敗ではないので警告は出さない
  if(a.status==="manual"){
    return `<p class="empty">このサイトは自動取得できないため、上の公式サイトから直接確認してください。</p>`;
  }

  // 取得に失敗した官庁は「新着なし」と区別して明示する
  if(a.status==="error"){
    return `<div class="failbox">
      <p class="failmsg">取得に失敗しました。新着の有無は不明です。</p>
      <p class="failnote">${esc(methodLabel(a))}での取得がエラーになりました。翌朝の自動実行で回復しない場合は取得処理の調整が必要です。<br>${esc(a.errors[0]||"")}</p>
    </div>`;
  }

  const items = newOnly ? newItemsOf(a) : a.items;
  let out = "";

  if(a.status==="partial"){
    out += `<div class="failbox">
      <p class="failmsg">一部の系統で取得に失敗しました。</p>
      <p class="failnote">下記は取得できた分のみです。<br>${esc(a.errors[0]||"")}</p>
    </div>`;
  }

  if(items.length===0){
    out += `<p class="empty">${newOnly?"新着はありません":"項目がありません"}</p>`;
    return out;
  }

  out += `<ul>`+items.map(it=>`
    <li><a href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">
      <span class="d">${esc(it.date||"—")}</span>
      <span class="body">${it.is_new?'<span class="new">新着</span>':""}<span class="t">${esc(it.title)}</span></span>
      <span class="chev" aria-hidden="true">›</span>
    </a></li>`).join("")+`</ul>`;
  return out;
}

function render(){
  if(!DATA) return;
  const meta=document.getElementById("meta");
  const alert=document.getElementById("alert");
  const main=document.getElementById("main");
  const btn=document.getElementById("copyBtn");

  const newCount=copyTargets().length;
  const range = DATA.previous_generated_at
    ? `前回取得 ${DATA.previous_generated_at} 以降の新着 ${newCount}件`
    : `新着 ${newCount}件（初回取得のため全件が新着扱い）`;
  meta.textContent = `最終取得: ${DATA.generated_at} JST ／ ${range}`;

  // 取得失敗は選択状態に関わらず常に知らせる。
  // 手動確認扱いの機関は失敗ではないので、ここには含めない。
  const broken=DATA.agencies.filter(a=>a.status==="error"||a.status==="partial");
  alert.innerHTML = broken.length
    ? `<p class="alert">${esc(broken.map(a=>a.name).join("、"))}の取得に失敗しました</p>`
    : "";

  btn.disabled = newCount===0;
  btn.textContent = newCount===0
    ? (selected.size===0 ? "官庁が選択されていません" : "新着なし")
    : `新着分をコピー（${newCount}件）`;

  renderScope();
  renderAgencyPanel();

  if(selected.size===0){
    main.innerHTML = `<p class="notice">表示する官庁を選択してください</p>`;
    return;
  }

  main.innerHTML = shownAgencies().map(a=>`<section class="${a.status==="error"?"broken":""}">
      <div class="sec-head">
        <h2>${esc(a.name)}</h2>
        ${tagFor(a)}
      </div>
      <a class="sitelink" href="${esc(a.site)}" target="_blank" rel="noopener noreferrer">公式サイト ↗</a>
      ${bodyFor(a)}
    </section>`).join("");
}

async function copyToday(){
  const text=buildCopyText();
  if(!text) return;
  const btn=document.getElementById("copyBtn");
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    // クリップボード権限が制限された環境向けのフォールバック
    const ta=document.createElement("textarea");
    ta.value=text;document.body.appendChild(ta);ta.select();
    document.execCommand("copy");document.body.removeChild(ta);
  }
  const orig=btn.textContent;
  btn.textContent="コピーしました ✓";btn.classList.add("copied");
  setTimeout(()=>{btn.textContent=orig;btn.classList.remove("copied");},2000);
}

document.getElementById("copyBtn").onclick=copyToday;

fetch("data/news.json?t="+Date.now())
  .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
  .then(d=>{
    DATA=d;
    DATA.agencies.forEach(a=>selected.add(a.id));  // 初期状態は全官庁オン
    render();
  })
  .catch(()=>{
    document.getElementById("meta").textContent="データがまだありません。GitHub Actionsを一度手動実行してください。";
  });
</script>
</body>
</html>
