name: Update regulatory news

on:
  schedule:
    # JST 3:40 (= UTC 18:40 前日) に毎日実行。
    # 毎時0分ちょうどはGitHub側が混雑して後回しにされやすく、6:00指定で実際には
    # 6:56に走っていた。半端な分に置くことで遅延を抑える。
    # 多少遅れても朝の閲覧までに終わるよう、時刻自体も早めにとってある。
    - cron: "40 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch news
        run: python scripts/fetch_news.py

      - name: Commit and push if changed
        run: |
          git config user.name "reg-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/news.json data/seen.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update news $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
